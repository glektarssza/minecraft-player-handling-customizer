dependencies {
    if (getPropertyOrDefault('mod.assetmover.enabled', 'false').toBoolean()) {
        implementation 'com.cleanroommc:assetmover:2.5'
    }
    if (getPropertyOrDefault('mod.mixins.enabled', 'false').toBoolean()) {
        def refMapName = 'mixins.' + getProperty('mod.id') + '.refmap.json'
        def mixinProviderSpec = 'zone.rong:mixinbooter:10.7'

        // -- Common
        annotationProcessor('org.ow2.asm:asm-debug-all:5.2')
        annotationProcessor('com.google.guava:guava:33.6.0-jre')
        annotationProcessor('com.google.code.gson:gson:2.14.0')

        // -- Mixins
        implementation(modUtils.enableMixins(mixinProviderSpec, refMapName))
        api(mixinProviderSpec) { transitive = false }
        annotationProcessor(mixinProviderSpec) { transitive = false }
    }

    // -- Runtime-only mods (things we like for easier testing!)
    runtimeOnlyNonPublishable rfg.deobf('curse.maven:had-enough-items-557549:5815590')
    runtimeOnlyNonPublishable rfg.deobf('curse.maven:configanytime-870276:5212709')
    runtimeOnlyNonPublishable rfg.deobf('curse.maven:universal-tweaks-705000:5529764')
    runtimeOnlyNonPublishable rfg.deobf('curse.maven:jei-utilities-616190:4318448')
    runtimeOnlyNonPublishable rfg.deobf('curse.maven:in-game-account-switcher-232676:3993185')
    runtimeOnlyNonPublishable rfg.deobf('curse.maven:the-one-probe-245211:2667280')

    // -- Runtime-only mods (for testing various mod compatibility)
    if (getPropertyOrDefault('mod.mixins.advent_of_ascension_compat', 'false').toBoolean()) {
        devOnlyNonPublishable rfg.deobf('curse.maven:advent-of-ascension-nevermine-311054:3054253')
    }
    if (getPropertyOrDefault('mod.mixins.divine_rpg_compat', 'false').toBoolean()) {
        devOnlyNonPublishable rfg.deobf('curse.maven:official-divinerpg-363543:3081433')
    }
    if (getPropertyOrDefault('mod.mixins.aether_compat', 'false').toBoolean()) {
        devOnlyNonPublishable rfg.deobf('curse.maven:aether-255308:5035622')
    }

    // -- Testing
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.14.4')
    testImplementation(platform("org.junit:junit-bom:5.14.4"))
    testImplementation("org.junit.jupiter:junit-jupiter:5.14.4")
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.14.4')
    testImplementation('org.junit.jupiter:junit-jupiter-params:5.14.4')
    testImplementation('org.junit.platform:junit-platform-launcher:1.14.4')
    testImplementation("org.assertj:assertj-core:3.27.7")
    testImplementation("net.datafaker:datafaker:1.9.0")
}
