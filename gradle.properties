# Project #
mod.name="Player Handling Customizer"
mod.id=player_handling_customizer
mod.author="G'lek Tarssza"
mod.description="A Minecraft mod for 1.12.2 that allows for customizing how players are damaged, targeted, and knocked back by various sources."
mod.version=0.0.2
mod.homepage=https://github.com/glektarssza/minecraft-player-handling-customizer
mod.credits="G'lek Tarssza for this mod."
mod.license="All rights reserved."
mod.base_group=com.glektarssza
mod.group=player_handling_customizer
mod.archive_base_name=player-handling-customizer
mod.dependencies=
mod.version.accepted_save_range="[0.0.1,0.0.2)"
mod.version.accepted_remote_range="[0.0.1,0.0.2)"
mod.sided_proxy.client_side=com.glektarssza.player_handling_customizer.ClientProxy
mod.sided_proxy.server_side=com.glektarssza.player_handling_customizer.ServerProxy
mod.gui_factory=
mod.update_manifest_url=https://github.com/glektarssza/minecraft-player-handling-customizer/raw/branch/main/forgeUpdateManifest.json
mod.signature=
mod.mixins.enabled=true
mod.mixins.hot_swap.enabled=true

# Minecraft Settings
minecraft.version=1.12.2
minecraft.version.range="[1.12.2,1.13.0)"

# Java Settings
java.compiler.file.encoding=UTF-8

# RetroFuturaGradle Settings
mod.mixins.enabled=true
mod.assetmover.enabled=false
mod.access_transformers.enabled=true
mod.core_mod.enabled=true
mod.core_mod.plugin_class=com.glektarssza.player_handling_customizer.coremod.CorePlugin
mod.core_mod.include_mod=true

# Mod Compatibility Settings
mod.mixins.advent_of_ascension_compat=true
mod.mixins.aether_compat=true
mod.mixins.divine_rpg_compat=true

# Linting Settings
lint.spotless.enabled=true
lint.checkstyle.enabled=false

# Gradle Settings
org.gradle.caching=true
org.gradle.configuration-cache=true
